name: Kodit.io
description: Kodit.io was a Helsinki-based proptech and "iBuyer" that used machine learning
  and automation to make instant cash offers on residential property, buying homes directly
  from sellers and reselling them, with operations in Finland, Spain and Poland. Founded in
  2017 and backed by Speedinvest among others, the company rebranded to Rive in 2022 after a
  EUR 23M Series A aimed at simplifying home buying and selling across Europe. In January 2024
  Rive (formerly Kodit.io) transferred its entire Finnish real estate brokerage business to
  Neliöt Liikkuu LKV, and the Kodit.io LKV entity subsequently entered bankruptcy proceedings
  in late 2024. The company operated a consumer-facing marketplace only; it never published a
  public developer portal, API documentation, SDKs, or machine-readable API artifacts, and the
  kodit.io domain has since lapsed to an unrelated registrant. This profile is retained as a
  historical network record.
